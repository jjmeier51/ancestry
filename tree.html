<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Tree</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"></header>
  <main>
    <div class="wrap wrap-wide">
      <div class="tree-toolbar">
        <label>Person
          <select id="tree-root" aria-label="Root person"></select>
        </label>
        <div class="seg" role="group" aria-label="View">
          <button type="button" data-view="ancestors">Ancestors</button>
          <button type="button" data-view="descendants">Descendants</button>
        </div>
        <label>Generations
          <select id="tree-gens">
            <option value="3">3</option><option value="4" selected>4</option><option value="5">5</option>
            <option value="6">6</option><option value="99">All</option>
          </select>
        </label>
        <span class="spacer"></span>
        <button type="button" class="btn ghost small" id="tree-fit">Fit to screen</button>
      </div>
      <div class="tree-stage" id="tree-stage">
        <svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Family tree chart"><g id="tree-layer"></g></svg>
        <div class="tree-legend"><span><i style="background:var(--male)"></i>Male</span><span><i style="background:var(--female)"></i>Female</span><span><i style="background:var(--gold)"></i>Marriage</span></div>
        <div class="tree-zoom"><button type="button" id="zoom-in" aria-label="Zoom in">+</button><button type="button" id="zoom-out" aria-label="Zoom out">−</button></div>
      </div>
      <p class="muted" style="margin-top:10px">Drag to pan, scroll or pinch to zoom. Click a person for options; click <strong>+</strong> to reveal more generations.</p>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script src="data/family.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tree.js"></script>
</body>
</html>
