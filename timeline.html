<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"></header>
  <main>
    <div class="wrap">
      <h1 style="margin-top:36px">Timeline</h1>
      <p class="muted" id="timeline-intro"></p>
      <div class="filters" id="timeline-filters">
        <label><input type="checkbox" value="birth" checked> Births</label>
        <label><input type="checkbox" value="marriage" checked> Marriages</label>
        <label><input type="checkbox" value="death" checked> Deaths</label>
        <label><input type="checkbox" value="story" checked> Stories</label>
        <label><input type="checkbox" value="event" checked> Other events</label>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script src="data/family.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/timeline.js"></script>
</body>
</html>
